group = dev.avinlang
version = 0.0.3

# The directory holding the Avin editor files the plugin ships: package.json,
# language-configuration.json and syntaxes/avin.tmLanguage.json. Relative paths are resolved
# against this project's directory. Override with -PavinEditorDir=<dir>.
avinEditorDir = ../avin/editors/vscode

# The IntelliJ Platform the plugin is built and verified against, and the LSP4IJ release it uses.
platformVersion = 2026.2.4
lsp4ijVersion = 0.21.0

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
